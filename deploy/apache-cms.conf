# Apache VirtualHost — Strapi CMS reverse-proxy (LAMP)
# Enable: a2enmod proxy proxy_http headers rewrite ssl
# Install:  cp deploy/apache-cms.conf /etc/apache2/sites-available/santamar-cms.conf
#           a2ensite santamar-cms && systemctl reload apache2

<VirtualHost *:80>
  ServerName cms.santamar.example

  # Large media uploads (adjust as needed)
  LimitRequestBody 52428800

  ProxyPreserveHost On
  ProxyPass / http://127.0.0.1:1337/
  ProxyPassReverse / http://127.0.0.1:1337/

  RequestHeader set X-Forwarded-Proto "http"
  RequestHeader set X-Forwarded-Port "80"

  ErrorLog ${APACHE_LOG_DIR}/santamar-cms-error.log
  CustomLog ${APACHE_LOG_DIR}/santamar-cms-access.log combined
</VirtualHost>

