# Apache VirtualHost — Next.js public site reverse-proxy (LAMP)
# Enable: a2enmod proxy proxy_http headers rewrite ssl
# Install:  cp deploy/apache-web.conf /etc/apache2/sites-available/santamar-web.conf
#           a2ensite santamar-web && systemctl reload apache2
#
# Next.js is NOT static DocumentRoot — locale middleware and ISR need Node.

<VirtualHost *:80>
  ServerName santamar.example

  ProxyPreserveHost On
  ProxyPass / http://127.0.0.1:3000/
  ProxyPassReverse / http://127.0.0.1:3000/

  RequestHeader set X-Forwarded-Proto "http"
  RequestHeader set X-Forwarded-Port "80"

  ErrorLog ${APACHE_LOG_DIR}/santamar-web-error.log
  CustomLog ${APACHE_LOG_DIR}/santamar-web-access.log combined
</VirtualHost>

