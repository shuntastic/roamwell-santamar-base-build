# Nginx for Santamar on a single EC2 Free Tier host.
#
# Mode A — no custom domains (lab / Elastic IP only):
#   One default server: /admin /api /uploads → Strapi, everything else → Next.
#
# Mode B — SITE_DOMAIN + CMS_DOMAIN set:
#   bootstrap replaces placeholders and uses two server blocks (site + cms).

upstream santamar_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream santamar_cms {
  server 127.0.0.1:1337;
  keepalive 32;
}

# --- Mode A: single host (Elastic IP) ---
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  client_max_body_size 50m;

  location /admin {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://santamar_cms;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://santamar_cms;
  }

  location /uploads {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://santamar_cms;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass http://santamar_web;
  }
}

