# Dual-host Nginx template for SITE_DOMAIN + CMS_DOMAIN.
# bootstrap-remote.sh substitutes:
#   __SITE_DOMAIN__  __CMS_DOMAIN__  __PUBLIC_IP__
# Certbot (or bootstrap) adds listen 443 + ssl_certificate lines when certs exist.

upstream santamar_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream santamar_cms {
  server 127.0.0.1:1337;
  keepalive 32;
}

# --- Public site (Next.js) ---
server {
  listen 80;
  listen [::]:80;
  server_name __SITE_DOMAIN__ __PUBLIC_IP__;

  client_max_body_size 50m;

  # Optional: keep /api + /uploads on the site host for same-origin fetch if needed
  location ^~ /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass http://santamar_cms;
  }

  location ^~ /uploads {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass http://santamar_cms;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass http://santamar_web;
  }
}

# --- CMS host (Strapi only — all paths, including /content-manager) ---
server {
  listen 80;
  listen [::]:80;
  server_name __CMS_DOMAIN__;

  client_max_body_size 50m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass http://santamar_cms;
  }
}
