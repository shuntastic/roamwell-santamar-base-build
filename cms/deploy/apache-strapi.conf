# Apache VirtualHost reverse-proxy for Strapi on a LAMP server.
# Maintained copy: `/deploy/apache-cms.conf` (identical intent).
# Enable: a2enmod proxy proxy_http headers rewrite
# Place under /etc/apache2/sites-available/santamar-cms.conf

<VirtualHost *:80>
  ServerName cms.santamar.example

  LimitRequestBody 52428800

  ProxyPreserveHost On
  ProxyPass / http://127.0.0.1:1337/
  ProxyPassReverse / http://127.0.0.1:1337/

  RequestHeader set X-Forwarded-Proto "http"
  ErrorLog ${APACHE_LOG_DIR}/santamar-cms-error.log
  CustomLog ${APACHE_LOG_DIR}/santamar-cms-access.log combined
</VirtualHost>

# Optional TLS termination (certbot / Let's Encrypt recommended)
